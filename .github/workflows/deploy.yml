name: Build deploy branch

# Builds the static site on GitHub and publishes the ready-to-serve files (out/) to the `deploy` branch.
# Hostinger deploys that branch straight into public_html — nothing to install or compile on the host.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Upload website files (download this and put the contents in public_html)
        uses: actions/upload-artifact@v4
        with:
          name: celina-bites-website
          path: out

      - name: Publish to the deploy branch
        run: |
          # Make out/ a ready-to-run Node app too (Hostinger Node.js web app): nothing to install or build.
          cp scripts/deploy-server.js out/server.js
          cat > out/package.json <<'JSON'
          {
            "name": "celina-bites-site",
            "version": "1.0.0",
            "private": true,
            "description": "Prebuilt Celina Bites site, generated by GitHub Actions from main. Do not edit here.",
            "main": "server.js",
            "scripts": { "build": "echo prebuilt", "start": "node server.js" },
            "engines": { "node": ">=18" }
          }
          JSON
          cd out
          touch .nojekyll
          git init -q -b deploy
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build ${GITHUB_SHA::7} from main"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
